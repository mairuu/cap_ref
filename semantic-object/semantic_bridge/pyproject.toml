[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-bridge"
version = "0.1.0"
description = "FastAPI bridge between ROS2 topics and browser WebSocket clients"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "anyio[trio]>=4.4.0",
    "pillow>=10.0.0",
]

[project.scripts]
semantic-bridge = "semantic_bridge.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["semantic_bridge"]
